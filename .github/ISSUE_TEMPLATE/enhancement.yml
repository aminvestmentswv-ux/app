name: App enhancement
description: Track one software improvement without duplicating operational tasks.
body:
  - type: markdown
    attributes:
      value: Public information only. Keep customer follow-ups and property tasks in Basecamp or REsimpli.
  - type: textarea
    id: problem
    attributes:
      label: User problem and proposed improvement
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and how to test them
    validations:
      required: true
