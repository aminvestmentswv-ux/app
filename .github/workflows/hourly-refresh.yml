name: Hourly property refresh

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: am-investments-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and verify inventory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: https://app.aminvestmentswv.com/
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      __UNSAFE_EXPO_HOME_DIRECTORY: /tmp/am-investments-expo
      XDG_CACHE_HOME: /tmp/am-investments-cache
      AM_APP_WEB_BASE_PATH: /app
      EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-refresh.txt
      - name: Install locked dependencies
        run: |
          npm ci --no-audit
          python -m pip install --disable-pip-version-check -r .github/requirements-refresh.txt
      - name: Refresh listings from the official website
        run: npm run sync:properties
      - name: Validate inventory and application
        run: |
          npm run typecheck
          npm test
      - name: Select the active Pages address
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pages_address.py --github-env "$GITHUB_ENV"
      - name: Build the Pages app
        run: |
          npm run build:web -- --output-dir web-build --max-workers 2
          node scripts/export_inventory.mjs web-build
          python scripts/pages_address.py --web-dir web-build
          python scripts/prepare_web_push.py --web-dir web-build
      - name: Verify initialized notification UI in a browser
        if: env.EXPO_PUBLIC_ONESIGNAL_APP_ID != '' && env.AM_APP_WEB_DOMAIN == 'app.aminvestmentswv.com'
        run: |
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          elif command -v chromium >/dev/null; then
            export CHROMIUM_EXECUTABLE_PATH="$(command -v chromium)"
          else
            npx playwright install chromium
            export CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; process.stdout.write(chromium.executablePath())")"
          fi
          node scripts/smoke-startup.mjs web-build
      - name: Require a fresh import and write public health metadata
        run: python scripts/check_health.py --snapshot src/data/properties.json --web-dir web-build
      - name: Verify web assets and real property photos
        run: python scripts/verify_refresh.py --web-dir web-build --report test-results/hourly-refresh.json
      - name: Write refresh summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('test-results/hourly-refresh.json')
          if report.exists():
              result = json.loads(report.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Website inventory refresh\n\n')
                  summary.write('Website checked: ' + result['checkedAt'] + '\n\n')
                  summary.write('Validation passed: ' + str(result['passed']) + '\n\n')
                  for status, count in result['counts'].items():
                      summary.write('- ' + status + ': ' + str(count) + '\n')
                  summary.write('\nPhotos verified: ' + str(len(result['photos'])) + '\n')
          PY
      - name: Prepare verified Pages artifact and publication history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_pages_artifact.py --web-dir web-build
      - name: Upload verified Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web-build
      - name: Wait for uploaded Pages artifact
        id: artifact_ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          if ! [[ "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return an artifact ID."
            exit 1
          fi

          artifacts_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --max-time 5 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" "$artifacts_url" |
              jq -e --arg id "$PAGES_ARTIFACT_ID" '
                any(.artifacts[]; .name == "github-pages"
                    and (.id | tostring) == $id and .expired == false)
              ' >/dev/null; then
              echo "Pages artifact $PAGES_ARTIFACT_ID is visible on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done

          echo "::error::Uploaded Pages artifact $PAGES_ARTIFACT_ID was not visible to the Actions API after six checks."
          exit 1
      - name: Deploy verified Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          timeout: 1200000
      - name: Pause before the single deployment retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry the same verified Pages artifact once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          timeout: 1200000
      - name: Record deployment result
        if: always()
        env:
          ARTIFACT_RESULT: ${{ steps.artifact_ready.outcome }}
          FIRST_RESULT: ${{ steps.deployment.outcome }}
          RETRY_RESULT: ${{ steps.deployment_retry.outcome }}
        run: |
          echo "Pages artifact readiness: $ARTIFACT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages first attempt: $FIRST_RESULT; retry: $RETRY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$FIRST_RESULT" = success || test "$RETRY_RESULT" = success
      - name: Verify published iPhone startup responses
        if: env.AM_APP_WEB_DOMAIN == 'app.aminvestmentswv.com'
        env:
          AM_PAGES_DEPLOYMENT_ID: ${{ github.sha }}
        run: python scripts/verify_published_startup.py --web-dir web-build
      - name: Verify published native inventory
        if: env.AM_APP_WEB_DOMAIN == 'app.aminvestmentswv.com'
        run: node scripts/verify_published_inventory.mjs web-build
      - name: Deliver opted-in property alerts when configured
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/send_property_notifications.py
