name: Create private property watch staging
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: property-watch-private-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare and test fixed private-first request
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/private_bootstrap.py" <<'PY'
          import json, os, sys, urllib.request
          ACCOUNT = "8129bba75a10f796d9879e727cd70680"
          NAME = "am-property-watch-registry-staging"
          BASE = "https://api.cloudflare.com/client/v4/accounts/" + ACCOUNT
          PAYLOAD = {"name": NAME, "subdomain": {"enabled": False, "previews_enabled": False}}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          def private(result):
              return result.get("name") == NAME and result.get("subdomain", {}).get("enabled") is False and result.get("subdomain", {}).get("previews_enabled") is False
          def run(api):
              result = api("POST", "/workers/workers", PAYLOAD)
              if not private(result):
                  raise RuntimeError("private creation not verified")
              worker_id = result.get("id", "")
              if not worker_id or not all(c.isalnum() or c == "-" for c in worker_id):
                  raise RuntimeError("invalid worker identifier")
              result = api("GET", "/workers/workers/" + worker_id, None)
              if not private(result):
                  raise RuntimeError("private readback not verified")
              if result.get("deployed_on"):
                  raise RuntimeError("unexpected deployment")
              print("Private staging Worker created and read back. No deployment, public routes, bindings, database credentials or notifications.")
          def test():
              calls = []
              result = {"id": "test-id", **PAYLOAD, "deployed_on": None}
              def fake(method, path, data):
                  calls.append((method, path, data))
                  return result
              run(fake)
              assert calls == [("POST", "/workers/workers", PAYLOAD), ("GET", "/workers/workers/test-id", None)]
              for bad in [{}, {"name": NAME}, {"name": NAME, "subdomain": {"enabled": True, "previews_enabled": False}}, {"name": NAME, "subdomain": {"enabled": False, "previews_enabled": True}}]:
                  assert not private(bad)
              print("Offline request allowlist and private-first guard tests passed.")
          def live():
              token = os.environ.get("CLOUDFLARE_BOOTSTRAP_TOKEN", "")
              if not token:
                  raise RuntimeError("missing credential")
              opener = urllib.request.build_opener(NoRedirect())
              def api(method, path, data):
                  if (method, path) != ("POST", "/workers/workers") and not (method == "GET" and path.startswith("/workers/workers/")):
                      raise RuntimeError("operation not allowed")
                  req = urllib.request.Request(BASE + path, data=None if data is None else json.dumps(data).encode(), method=method, headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
                  with opener.open(req, timeout=30) as response:
                      doc = json.loads(response.read(1000000))
                  if doc.get("success") is not True:
                      raise RuntimeError("API rejected operation")
                  return doc["result"]
              run(api)
          if __name__ == "__main__":
              try:
                  test() if sys.argv[1:] == ["--test"] else live()
              except Exception:
                  print("Bootstrap failed; inspect non-secret dashboard state before retrying. Revoke temporary credential.", file=sys.stderr)
                  sys.exit(1)
          
          PY
          python "$RUNNER_TEMP/private_bootstrap.py" --test
      - name: Create disabled empty service only
        env:
          CLOUDFLARE_BOOTSTRAP_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
        shell: bash
        run: python "$RUNNER_TEMP/private_bootstrap.py"
