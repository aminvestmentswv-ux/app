name: Native candidate browser checks
on:
  push:
    branches: [test/native-live-feed-2026-11-07]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'scripts/smoke-web.mjs'
      - '.github/workflows/browser-native-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'aminvestmentswv-ux/app' && github.ref == 'refs/heads/test/native-live-feed-2026-11-07'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      CI: '1'
      AM_APP_WEB_BASE_PATH: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit
      - name: Export and test actual browser flows
        run: |
          npm run build:web -- --output-dir dist --max-workers 2
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          else
            npx playwright install chromium
            export CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; process.stdout.write(chromium.executablePath())")"
          fi
          npm run test:ui
      - name: Retain browser screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-browser-${{ github.sha }}
          path: test-results/*.png
          retention-days: 3
          if-no-files-found: warn
