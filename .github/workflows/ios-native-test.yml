name: iOS native test only
on:
  push:
    branches: [test/native-live-feed-2026-11-07]
    # Preserve the completed iOS result for Android-only harness repairs.
    # Workflow-only edits use manual dispatch on the isolated branch.
    paths:
      - '**'
      - '!scripts/*android*'
      - '!tests/test_android_native_smoke.py'
      - '!tests/fixtures/android*'
      - '!.github/workflows/android-native-test.yml'
      - '!.github/workflows/ios-native-test.yml'
      - '!scripts/smoke-web.mjs'
      - '!scripts/smoke-buyer-agent.mjs'
      - '!.github/workflows/browser-native-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    if: github.repository == 'aminvestmentswv-ux/app' && github.ref == 'refs/heads/test/native-live-feed-2026-11-07' && github.event.repository.private == false
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      AM_TEST_IOS_BUNDLE_ID: com.aminvestments.nativeqatest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r .github/requirements-refresh.txt
      - name: Record source and runner
        run: |
          mkdir -p test-results/ios
          git rev-parse HEAD > test-results/ios/source-sha.txt
          printf '%s\n' "$ImageOS" "$ImageVersion" > test-results/ios/runner.txt
      - run: npm ci --no-audit
      - name: Build and test unsigned installed iOS app
        run: bash scripts/ios-native-test.sh
      - name: Export XCTest screenshots
        if: always()
        run: |
          if [ -f test-results/ios/xcode-test.log ]; then tail -1500 test-results/ios/xcode-test.log > test-results/ios/xcode-test-tail.txt; fi
          if [ -d test-results/ios/acceptance.xcresult ]; then
            xcrun xcresulttool get test-results summary --path test-results/ios/acceptance.xcresult > test-results/ios/xctest-summary.json
            xcrun xcresulttool export attachments --path test-results/ios/acceptance.xcresult --output-path test-results/ios/screenshots
          fi
      - name: Retain test evidence briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-native-${{ github.sha }}
          path: |
            test-results/ios/screenshots
            test-results/ios/*.json
            test-results/ios/*.txt
            test-results/native-inventory-metadata.json
          retention-days: 3
          if-no-files-found: error
