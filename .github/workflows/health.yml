name: Published app freshness

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check recent successful refresh and published import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/${{ github.repository }}/actions/workflows/hourly-refresh.yml/runs?branch=main&status=success&per_page=1' > /tmp/refresh-runs.json
          python - <<'PY'
          import json
          from scripts.check_health import check_timestamp
          runs = json.load(open('/tmp/refresh-runs.json'))['workflow_runs']
          if not runs:
              raise SystemExit('No successful refresh found')
          check_timestamp(runs[0]['updated_at'])
          PY
          python scripts/check_health.py --url https://app.aminvestmentswv.com/health.json
