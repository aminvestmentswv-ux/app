name: Private watch database readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/private-watch-readiness.yml]
permissions:
  contents: read
concurrency:
  group: private-watch-staging
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/private-watch-probe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test offline fail-closed guards and timing diagnostics
        run: |
          node --test probe.test.mjs tail.test.mjs
          node build.mjs 0
          node --input-type=module -e "const m=await import('./bundle.mjs');if(m.default.fetch().status!==503)process.exit(1);await m.default.scheduled({scheduledTime:0},new Proxy({},{get(){throw Error('unexpected secret access')}}));"
      - name: Private scheduled read-only test with cleanup
        timeout-minutes: 25
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WATCH_STAGING_TOKEN }}
        run: node run.mjs
      - name: Independent cleanup and privacy verification
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WATCH_STAGING_TOKEN }}
        run: node cleanup.mjs
